name: Django CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: curl -sSL https://install.python-poetry.org | python3 -
      - run: poetry install
      - run: echo "SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}" > .env
      - run: echo "DEBUG=True" >> .env
      - run: docker-compose up -d  # запускает PostgreSQL и приложение
      - run: docker-compose exec app poetry run python manage.py migrate
      - run: docker-compose exec app poetry run python manage.py test
      - run: docker-compose down  # очищает контейнеры после джобы
